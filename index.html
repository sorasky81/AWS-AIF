<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIF-C01 暗記ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg:#EFF2F5;
  --surface:#FFFFFF;
  --surface-2:#F6F8FA;
  --ink:#16202C;
  --ink-2:#4A5867;
  --ink-3:#788695;
  --line:#DCE3EA;
  --line-2:#C5D0DA;
  --accent:#B25400;
  --accent-ink:#8F4300;
  --accent-soft:#FDF0E2;
  --good:#1E7A55;
  --good-soft:#E4F4EC;
  --bad:#B3342F;
  --bad-soft:#FCE9E7;
  --teal:#0F6E78;
  --teal-soft:#E3F1F3;
  --shadow:0 1px 2px rgba(22,32,44,.06), 0 8px 24px -12px rgba(22,32,44,.18);
  --radius:14px;
  --font-display:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
  --font-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F1720; --surface:#17212C; --surface-2:#1E2A37;
    --ink:#E7ECF1; --ink-2:#AEBAC7; --ink-3:#7F8C9A;
    --line:#2A3744; --line-2:#3A4959;
    --accent:#FFB05C; --accent-ink:#FFC489; --accent-soft:#34261A;
    --good:#4FC08D; --good-soft:#143226;
    --bad:#F08079; --bad-soft:#38201E;
    --teal:#5FD0D9; --teal-soft:#123239;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1720; --surface:#17212C; --surface-2:#1E2A37;
  --ink:#E7ECF1; --ink-2:#AEBAC7; --ink-3:#7F8C9A;
  --line:#2A3744; --line-2:#3A4959;
  --accent:#FFB05C; --accent-ink:#FFC489; --accent-soft:#34261A;
  --good:#4FC08D; --good-soft:#143226;
  --bad:#F08079; --bad-soft:#38201E;
  --teal:#5FD0D9; --teal-soft:#123239;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none !important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;
  top:env(safe-area-inset-top, 0px);
  z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:12px 10px;
  background:linear-gradient(var(--bg) 76%, transparent);
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand-mark{
  font-family:var(--font-mono);font-weight:600;font-size:11px;letter-spacing:.12em;
  color:var(--accent-ink);background:var(--accent-soft);
  padding:3px 7px;border-radius:5px;white-space:nowrap;
}
.brand h1{
  font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;
  margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.meter{display:flex;align-items:center;gap:9px;flex-shrink:0}
.ring{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(var(--good) var(--p,0deg), var(--line) 0);
  display:grid;place-items:center;
}
.ring::after{content:"";width:24px;height:24px;border-radius:50%;background:var(--bg)}
.meter-txt{font-family:var(--font-mono);font-size:10px;line-height:1.35;color:var(--ink-3);text-align:right;white-space:nowrap}
.meter-txt b{display:block;font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- mode tabs ---------- */
.modes{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  background:var(--surface-2);border:1px solid var(--line);
  padding:4px;border-radius:12px;margin-bottom:12px;
}
.modes button{
  border:0;background:transparent;cursor:pointer;
  padding:8px 4px;border-radius:9px;
  font-family:var(--font-display);font-weight:500;font-size:13px;color:var(--ink-2);
  transition:background .16s ease,color .16s ease;
}
.modes button[aria-selected="true"]{
  background:var(--surface);color:var(--ink);font-weight:700;
  box-shadow:0 1px 2px rgba(22,32,44,.1);
}

/* ---------- scope ---------- */
.scopebar{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;min-width:0}
.scope-label{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3);
  flex-shrink:0;padding-top:7px;
}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:2px 6px;scrollbar-width:thin;min-width:0}
.chips::-webkit-scrollbar{height:4px}
.chips::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.chip{
  flex-shrink:0;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);border-radius:999px;padding:4px 11px;font-size:12px;line-height:1.7;
  transition:border-color .14s ease,color .14s ease,background .14s ease;
}
.chip .n{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-right:5px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.chip[aria-pressed="true"] .n{color:var(--accent)}

/* ---------- shared ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{
  cursor:pointer;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);border-radius:10px;padding:11px 16px;
  font-family:var(--font-display);font-weight:500;font-size:14px;
  transition:border-color .14s ease,background .14s ease,transform .1s ease;
}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn-primary:hover{border-color:var(--ink);opacity:.9}
.btn-good{color:var(--good);border-color:var(--good)}
.btn-good:hover{background:var(--good-soft);border-color:var(--good)}
.btn-again{color:var(--bad);border-color:var(--bad)}
.btn-again:hover{background:var(--bad-soft);border-color:var(--bad)}
.hk{font-family:var(--font-mono);font-size:11px;opacity:.55}

/* ---------- 見分け方 callout ---------- */
.keybox{border-left:3px solid var(--teal);background:var(--teal-soft);border-radius:0 10px 10px 0;padding:11px 14px}
.keybox + .keybox{margin-top:8px}
.keybox-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--teal);font-weight:600;margin-bottom:5px}
.keysegs{display:flex;flex-direction:column;gap:3px}
.keyseg{font-size:13px;line-height:1.75;color:var(--ink-2);text-wrap:pretty}
.keyseg b{color:var(--ink);font-weight:700;font-family:var(--font-display)}
.keyseg .arw{color:var(--teal);font-family:var(--font-mono);font-size:11px;margin:0 5px}

/* ---------- flashcard ---------- */
.stage-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;color:var(--ink-3)}
.stage-meta .sec-lbl{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-meta .sec-lbl i{
  font-style:normal;font-family:var(--font-mono);font-size:10px;font-weight:600;
  color:var(--surface);background:var(--ink-3);border-radius:4px;padding:1px 5px;flex-shrink:0;
}
.stage-meta .cnt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;flex-shrink:0}

.flashcard{
  width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:24px 20px;min-height:236px;
  display:flex;flex-direction:column;gap:14px;
}
.fc-term{font-family:var(--font-display);font-weight:700;font-size:clamp(21px,5.2vw,28px);line-height:1.45;letter-spacing:.01em;text-wrap:balance}
.fc-prompt{font-size:15px;line-height:1.9;color:var(--ink);text-wrap:pretty}
.fc-answer{border-top:1px dashed var(--line-2);padding-top:14px;display:flex;flex-direction:column;gap:12px;animation:rise .2s ease both}
.fc-answer .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);margin-bottom:2px}
.fc-answer .ans-term{font-family:var(--font-display);font-weight:700;font-size:clamp(19px,4.6vw,25px);line-height:1.45;text-wrap:balance}
.fc-answer .ans-desc{font-size:14.5px;line-height:1.9;color:var(--ink-2);text-wrap:pretty}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fc-hint{margin-top:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kbd{border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:10px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;padding:2px 8px;border-radius:999px}
.tag.known{color:var(--good);background:var(--good-soft)}
.tag.again{color:var(--bad);background:var(--bad-soft)}

.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.card-actions .btn{padding-block:13px}
.card-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.linkbtn{background:none;border:0;cursor:pointer;color:var(--ink-3);font-size:12.5px;padding:6px 2px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.linkbtn:hover{color:var(--ink)}

/* ---------- quiz ---------- */
.quiz-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.qbar{flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .28s ease}
.qmeta{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.q-card{padding:18px 20px 20px}
.q-kind{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--accent-ink);background:var(--accent-soft);padding:3px 8px;border-radius:5px;margin-bottom:12px}
.q-text{font-size:15.5px;line-height:1.85;text-wrap:pretty}
.q-text .term{font-family:var(--font-display);font-weight:700;font-size:clamp(19px,4.4vw,23px);line-height:1.5;display:block;margin-bottom:4px}
.q-text .ask{display:block;margin-top:8px;font-size:13px;color:var(--ink-3)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice{
  display:flex;gap:11px;align-items:flex-start;text-align:left;cursor:pointer;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;font-size:14px;line-height:1.75;color:var(--ink);
  transition:border-color .14s ease,background .14s ease;
}
.choice:hover:not(:disabled){border-color:var(--ink-3)}
.choice:disabled{cursor:default}
.choice .num{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-3);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;flex-shrink:0;margin-top:3px}
.choice .txt{flex:1;min-width:0;text-wrap:pretty}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.correct .num{color:var(--good);border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .num{color:var(--bad);border-color:var(--bad)}
.choice.dim{opacity:.45}
.verdict{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:14px;margin-bottom:10px}
.verdict.ok{color:var(--good)}
.verdict.ng{color:var(--bad)}
.q-foot{margin-top:14px}
.q-foot .btn{width:100%;margin-top:12px}

.result{padding:28px 22px;text-align:center}
.result .score{font-family:var(--font-mono);font-weight:600;font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
.result .score small{font-size:18px;color:var(--ink-3);font-weight:400}
.result h3{font-family:var(--font-display);font-size:16px;margin:10px 0 4px}
.result p{color:var(--ink-2);font-size:13.5px;margin:0 0 20px;text-wrap:pretty}
.result .btn{width:100%;max-width:300px}
.missed{margin-top:24px;text-align:left;border-top:1px solid var(--line);padding-top:16px}
.missed h4{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--bad);margin:0 0 12px}
.missed ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.missed li{font-size:13px;line-height:1.75;color:var(--ink-2);text-wrap:pretty}
.missed li b{display:block;font-family:var(--font-display);color:var(--ink);font-size:14.5px}

/* ---------- list ---------- */
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 13px;margin-bottom:18px}
.search input{flex:1;border:0;background:none;outline:none;padding:12px 0;font:inherit;font-size:14px;color:var(--ink);min-width:0}
.search svg{flex-shrink:0;color:var(--ink-3)}
.search .count{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);white-space:nowrap}

.sec{margin-bottom:32px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-num{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.sec-title{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0;text-wrap:balance}
.grp{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.rows{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.row{display:grid;grid-template-columns:minmax(0,190px) 1fr;gap:5px 18px;padding:11px 12px;border-radius:9px;border:1px solid transparent}
.row:nth-child(odd){background:var(--surface-2)}
.row.hit{border-color:var(--accent);background:var(--accent-soft)}
.row .nm{font-family:var(--font-display);font-weight:700;font-size:14px;line-height:1.65;word-break:break-word}
.row .ds{font-size:13.5px;line-height:1.8;color:var(--ink-2);text-wrap:pretty}
.flag{display:inline-block;vertical-align:middle;width:6px;height:6px;border-radius:50%;margin-left:7px}
.flag.known{background:var(--good)}
.flag.again{background:var(--bad)}
@media (max-width:560px){ .row{grid-template-columns:1fr;gap:3px} }

/* ---------- weak ---------- */
.empty{padding:44px 22px;text-align:center;color:var(--ink-3)}
.empty .big{font-size:28px;margin-bottom:10px}
.empty p{margin:0;font-size:14px;line-height:1.85;text-wrap:pretty}
.weak-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 20px}
.weak-item{display:flex;flex-direction:column;gap:6px;padding:14px 14px;border-radius:11px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.weak-item .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.weak-item .nm{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.5}
.weak-item .ds{font-size:13.5px;line-height:1.8;color:var(--ink-2);text-wrap:pretty}
.weak-item .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.weak-item .src{font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
.miss-n{font-family:var(--font-mono);font-size:10px;color:var(--bad);background:var(--bad-soft);padding:2px 7px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.clearbtn{background:none;border:1px solid var(--line-2);border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:12px;padding:4px 10px}
.clearbtn:hover{border-color:var(--good);color:var(--good)}

footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.95;color:var(--ink-3)}
footer code{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
footer .reset{background:none;border:0;cursor:pointer;color:var(--ink-3);font-size:11.5px;text-decoration:underline;text-underline-offset:3px;padding:0}
footer .reset:hover{color:var(--bad)}

@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important;transition-duration:.01ms !important} }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">AIF-C01</span>
      <h1>暗記ドリル</h1>
    </div>
    <div class="meter">
      <div class="ring" id="ring" aria-hidden="true"></div>
      <div class="meter-txt"><b id="meterNum">0 / 0</b>覚えた</div>
    </div>
  </header>

  <nav class="modes" role="tablist" aria-label="学習モード">
    <button role="tab" data-mode="card" aria-selected="true">カード</button>
    <button role="tab" data-mode="quiz" aria-selected="false">4択</button>
    <button role="tab" data-mode="list" aria-selected="false">一覧</button>
    <button role="tab" data-mode="weak" aria-selected="false">弱点</button>
  </nav>

  <div class="scopebar">
    <span class="scope-label">範囲</span>
    <div class="chips" id="scopeChips"></div>
  </div>

  <main>
    <section class="view" id="view-card">
      <div class="stage-meta">
        <span class="sec-lbl" id="cardSec"></span>
        <span class="cnt" id="cardCnt"></span>
      </div>
      <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="カードをめくる">
        <div id="fcTop"></div>
        <div class="fc-hint" id="fcHint"></div>
      </div>
      <div class="card-actions">
        <button class="btn btn-again" id="btnAgain">もう一度 <span class="hk">1</span></button>
        <button class="btn btn-good" id="btnKnown">覚えた <span class="hk">2</span></button>
      </div>
      <div class="card-nav">
        <button class="linkbtn" id="btnPrev">← 前へ</button>
        <button class="linkbtn" id="btnDir">出題: 名前 → 説明</button>
        <button class="linkbtn" id="btnNext">次へ →</button>
      </div>
    </section>

    <section class="view" id="view-quiz" hidden>
      <div id="quizPlay">
        <div class="quiz-head">
          <span class="qmeta" id="qPos">1 / 10</span>
          <div class="qbar"><i id="qBar" style="width:0%"></i></div>
          <span class="qmeta" id="qScore">正解 0</span>
        </div>
        <div class="panel q-card">
          <span class="q-kind" id="qKind"></span>
          <div class="q-text" id="qText"></div>
        </div>
        <div class="choices" id="choices"></div>
        <div class="q-foot">
          <div id="qFeedback"></div>
          <button class="btn btn-primary" id="qNext" hidden>次の問題 →</button>
        </div>
      </div>
      <div class="panel result" id="quizResult" hidden></div>
    </section>

    <section class="view" id="view-list" hidden>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="searchInput" type="search" placeholder="サービス名・キーワードで検索" aria-label="検索">
        <span class="count" id="searchCount"></span>
      </div>
      <div id="listBody"></div>
    </section>

  {nm:"S3 Express One Zone", ds:"単一AZで超低レイテンシ・高スループットを実現する高速アクセス向けクラス。頻繁に読み書きする分析処理などに向く。"},
  {nm:"S3 Glacier Instant Retrieval", ds:"アーカイブ用途向けだが、取り出しはミリ秒単位で即時に可能な低コストクラス。"},
  {nm:"S3 Glacier Flexible Retrieval", ds:"数分〜数時間で取り出し可能なアーカイブクラス（旧S3 Glacier）。年数回程度のアクセス向け。"},
  {nm:"S3 Glacier Deep Archive", ds:"S3の中で最も低コストなクラス。取り出しには12時間以上かかる。長期保管・法定保存用途向け。"}
], keys:[
  {l:"覚え方｜安い順", plain:true, nq:true, v:"Standard → Intelligent-Tiering → Standard-IA → One Zone-IA → Glacier Instant Retrieval → Glacier Flexible Retrieval → Glacier Deep Archive（右に行くほど保存費は安く、取り出しは遅い・高い）"}
]}
];

/* ============================================================
   準備
   ============================================================ */
const ITEMS = [];
DATA.forEach(sec => sec.items.forEach((it, i) => {
  ITEMS.push({ id: "s" + sec.n + "-" + i, sec: sec.n, secTitle: sec.t, secShort: sec.s, grp: it.g || "", nm: it.nm, ds: it.ds });
}));

/* 「見分け方」行を ペア に分解 */
function parseSegs(v){
  return v.split("／").map(s => s.trim()).filter(Boolean).map(seg => {
    const a = seg.split("＝");
    if (a.length === 2 && a[0].trim() && a[1].trim()) return { name: a[0].trim(), hint: a[1].trim(), form: "nd" };
    const b = seg.split("→");
    if (b.length === 2 && b[0].trim() && b[1].trim()) return { name: b[1].trim(), hint: b[0].trim(), form: "dn" };
    return { raw: seg };
  });
}
const norm = s => s.toLowerCase().replace(/[\s（）()「」・]/g, "");
function matchItem(name, secN){
  const t = norm(name);
  const inSec = ITEMS.filter(x => x.sec === secN);
  let hit = inSec.find(x => norm(x.nm) === t) || inSec.find(x => norm(x.nm).includes(t)) || inSec.find(x => t.includes(norm(x.nm)));
  if (hit) return hit;
  return ITEMS.find(x => norm(x.nm).includes(t) && t.length >= 3) || null;
}

const KEYPAIRS = [];
DATA.forEach(sec => (sec.keys || []).forEach(k => {
  if (k.nq) return;
  parseSegs(k.v).forEach(p => {
    if (p.raw) return;
    const it = matchItem(p.name, sec.n);
    if (!it) return;
    KEYPAIRS.push({ sec: sec.n, secTitle: sec.t, label: k.l, name: p.name, hint: p.hint, item: it });
  });
}));

/* ============================================================
   状態
   ============================================================ */
const STORE_KEY = "aif-c01-drill-v1";
let state = { known: {}, again: {}, miss: {} };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

let mode = "card";
let scope = 0;              // 0 = すべて
let cardDir = "n2d";        // n2d: 名前→説明 / d2n: 説明→名前
let deck = [], deckPos = 0, flipped = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };

function scopedItems(){ return scope === 0 ? ITEMS : ITEMS.filter(x => x.sec === scope); }
function weakItems(){
  return ITEMS.filter(x => state.again[x.id] || (state.miss[x.id] || 0) > 0)
              .sort((a, b) => (state.miss[b.id] || 0) - (state.miss[a.id] || 0));
}

/* ============================================================
   ヘッダー
   ============================================================ */
function renderMeter(){
  const pool = scopedItems();
  const done = pool.filter(x => state.known[x.id]).length;
  $("meterNum").textContent = done + " / " + pool.length;
  $("ring").style.setProperty("--p", (pool.length ? done / pool.length * 360 : 0) + "deg");
}

function renderChips(){
  const box = $("scopeChips");
  const mk = (n, label, count) =>
    '<button class="chip" data-sec="' + n + '" aria-pressed="' + (scope === n) + '">' +
    (n ? '<span class="n">' + String(n).padStart(2, "0") + "</span>" : "") + esc(label) +
    (count != null ? ' <span class="n" style="margin:0 0 0 4px">' + count + "</span>" : "") + "</button>";
  box.innerHTML = mk(0, "すべて", ITEMS.length) + DATA.map(s => mk(s.n, s.s, s.items.length)).join("");
  box.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    scope = +b.dataset.sec;
    renderChips(); renderMeter();
    if (mode === "card") { buildDeck(); renderCard(); }
    if (mode === "quiz") startQuiz(false);
    if (mode === "list") renderList();
  }));
}

/* ============================================================
   カード
   ============================================================ */
function buildDeck(){ deck = shuffle(scopedItems()); deckPos = 0; flipped = false; }

function renderCard(){
  if (!deck.length) { $("fcTop").innerHTML = '<div class="fc-prompt">この範囲にカードがありません。</div>'; return; }
  if (deckPos >= deck.length) deckPos = 0;
  const it = deck[deckPos];
  $("cardSec").innerHTML = "<i>" + String(it.sec).padStart(2, "0") + "</i><span>" + esc(it.secTitle) + "</span>";
  $("cardCnt").textContent = (deckPos + 1) + " / " + deck.length;

  const front = cardDir === "n2d"
    ? '<div class="fc-term">' + esc(it.nm) + "</div>"
    : '<div class="fc-prompt">' + esc(it.ds) + "</div>";
  const back = cardDir === "n2d"
    ? '<div class="fc-answer"><div><div class="lbl">覚えるポイント</div><div class="ans-desc">' + esc(it.ds) + "</div></div>" + keyHtmlFor(it) + "</div>"
    : '<div class="fc-answer"><div><div class="lbl">サービス名</div><div class="ans-term">' + esc(it.nm) + "</div></div>" + keyHtmlFor(it) + "</div>";

  $("fcTop").innerHTML = front + (flipped ? back : "");

  const st = state.known[it.id] ? '<span class="tag known">覚えた</span>'
           : state.again[it.id] ? '<span class="tag again">もう一度</span>' : "";
  const m = state.miss[it.id] || 0;
  $("fcHint").innerHTML = flipped
    ? st + (m ? '<span class="tag again">4択ミス ' + m + "</span>" : "") + '<span><span class="kbd">1</span> もう一度 / <span class="kbd">2</span> 覚えた</span>'
    : st + '<span><span class="kbd">Space</span> またはタップでめくる</span>';
}

function keyHtmlFor(it){
  const sec = DATA.find(s => s.n === it.sec);
  if (!sec || !sec.keys) return "";
  const rel = sec.keys.filter(k => {
    if (k.plain) return false;
    return parseSegs(k.v).some(p => !p.raw && matchItem(p.name, sec.n) && matchItem(p.name, sec.n).id === it.id);
  });
  return rel.map(k => keyBox(k, sec.n, it.id)).join("");
}

function keyBox(k, secN, highlightId){
  const segs = k.plain ? [{ raw: k.v }] : parseSegs(k.v);
  const body = segs.map(p => {
    if (p.raw) return '<div class="keyseg">' + esc(p.raw) + "</div>";
    const hit = matchItem(p.name, secN);
    const on = highlightId && hit && hit.id === highlightId;
    const nm = "<b" + (on ? ' style="color:var(--teal)"' : "") + ">" + esc(p.name) + "</b>";
    return '<div class="keyseg">' + (p.form === "nd"
      ? nm + '<span class="arw">＝</span>' + esc(p.hint)
      : esc(p.hint) + '<span class="arw">→</span>' + nm) + "</div>";
  }).join("");
  return '<div class="keybox"><div class="keybox-label">▶ ' + esc(k.l) + '</div><div class="keysegs">' + body + "</div></div>";
}

function flip(){ if (!deck.length) return; flipped = !flipped; renderCard(); }
function step(d){
  if (!deck.length) return;
  deckPos = (deckPos + d + deck.length) % deck.length;
  flipped = false; renderCard();
}
function mark(kind){
  if (!deck.length) return;
  const it = deck[deckPos];
  if (kind === "known") { state.known[it.id] = 1; delete state.again[it.id]; delete state.miss[it.id]; }
  else { state.again[it.id] = 1; delete state.known[it.id]; }
  save(); renderMeter(); step(1);
}

$("flashcard").addEventListener("click", flip);
$("flashcard").addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } });
$("btnPrev").addEventListener("click", () => step(-1));
$("btnNext").addEventListener("click", () => step(1));
$("btnAgain").addEventListener("click", () => mark("again"));
$("btnKnown").addEventListener("click", () => mark("known"));
$("btnDir").addEventListener("click", () => {
  cardDir = cardDir === "n2d" ? "d2n" : "n2d";
  $("btnDir").textContent = "出題: " + (cardDir === "n2d" ? "名前 → 説明" : "説明 → 名前");
  flipped = false; renderCard();
});

/* ============================================================
   4択クイズ
   ============================================================ */
const ROUND = 10;
let quiz = [], qi = 0, qScore = 0, qMissed = [], quizWeak = false;

function pickDistractors(pool, correct, keyFn, n){
  const same = shuffle(pool.filter(x => keyFn(x) !== keyFn(correct)));
  return same.slice(0, n);
}

function mkQ_d2n(it, pool){
  const d = pickDistractors(pool.filter(x => x.sec === it.sec), it, x => x.nm, 3);
  const fill = d.length < 3 ? pickDistractors(ITEMS.filter(x => x.sec !== it.sec), it, x => x.nm, 3 - d.length) : [];
  return { kind: "説明 → サービス", id: it.id, html: esc(it.ds) + '<span class="ask">これはどのサービス／機能？</span>',
           answer: it.nm, choices: shuffle([it.nm].concat(d.concat(fill).map(x => x.nm))), expl: it };
}
function mkQ_n2d(it, pool){
  const d = pickDistractors(pool.filter(x => x.sec === it.sec), it, x => x.ds, 3);
  const fill = d.length < 3 ? pickDistractors(ITEMS.filter(x => x.sec !== it.sec), it, x => x.ds, 3 - d.length) : [];
  return { kind: "サービス → 説明", id: it.id, html: '<span class="term">' + esc(it.nm) + '</span><span class="ask">説明として正しいものは？</span>',
           answer: it.ds, choices: shuffle([it.ds].concat(d.concat(fill).map(x => x.ds))), expl: it };
}
function mkQ_key(p){
  const it = p.item;
  const d = pickDistractors(ITEMS.filter(x => x.sec === p.sec), it, x => x.nm, 3);
  const fill = d.length < 3 ? pickDistractors(ITEMS.filter(x => x.sec !== p.sec), it, x => x.nm, 3 - d.length) : [];
  return { kind: "見分け方", id: it.id, html: "「" + esc(p.hint) + '」<span class="ask">この特徴に当てはまるのは？</span>',
           answer: it.nm, choices: shuffle([it.nm].concat(d.concat(fill).map(x => x.nm))), expl: it };
}

function startQuiz(weak){
  quizWeak = !!weak;
  const pool = weak ? weakItems() : scopedItems();
  if (pool.length < 2) {
    $("quizPlay").hidden = true; $("quizResult").hidden = false;
    $("quizResult").innerHTML = '<div class="empty"><div class="big">・・・</div><p>' +
      (weak ? "弱点カードがまだありません。<br>カードや4択で「もう一度」を付けると貯まります。" : "この範囲は問題を作るには項目が少なすぎます。<br>別の範囲を選んでください。") + "</p></div>";
    return;
  }
  const ids = new Set(pool.map(x => x.id));
  const bank = [];
  pool.forEach(it => { bank.push(mkQ_d2n(it, pool)); bank.push(mkQ_n2d(it, pool)); });
  KEYPAIRS.filter(p => ids.has(p.item.id)).forEach(p => bank.push(mkQ_key(p)));

  const picked = [], used = new Set();
  for (const q of shuffle(bank)) { if (picked.length >= ROUND) break; if (used.has(q.id)) continue; used.add(q.id); picked.push(q); }
  for (const q of shuffle(bank)) { if (picked.length >= ROUND) break; if (picked.includes(q)) continue; picked.push(q); }

  quiz = picked; qi = 0; qScore = 0; qMissed = [];
  $("quizResult").hidden = true; $("quizPlay").hidden = false;
  renderQ();
}

function renderQ(){
  const q = quiz[qi];
  $("qPos").textContent = (qi + 1) + " / " + quiz.length;
  $("qScore").textContent = "正解 " + qScore;
  $("qBar").style.width = (qi / quiz.length * 100) + "%";
  $("qKind").textContent = q.kind + (quizWeak ? " ・弱点" : "");
  $("qText").innerHTML = q.html;
  $("qFeedback").innerHTML = "";
  $("qNext").hidden = true;
  $("choices").innerHTML = q.choices.map((c, i) =>
    '<button class="choice" data-i="' + i + '"><span class="num">' + (i + 1) + '</span><span class="txt">' + esc(c) + "</span></button>").join("");
  $("choices").querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
}

function answer(i){
  const q = quiz[qi];
  const btns = Array.from($("choices").querySelectorAll(".choice"));
  if (btns[0].disabled) return;
  const ok = q.choices[i] === q.answer;
  btns.forEach((b, j) => {
    b.disabled = true;
    if (q.choices[j] === q.answer) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if (ok) { qScore++; }
  else {
    state.miss[q.expl.id] = (state.miss[q.expl.id] || 0) + 1;
    delete state.known[q.expl.id];
    qMissed.push(q.expl);
    save(); renderMeter();
  }
  $("qScore").textContent = "正解 " + qScore;
  $("qFeedback").innerHTML =
    '<div class="verdict ' + (ok ? "ok" : "ng") + '">' + (ok ? "◎ 正解" : "× 不正解") + "</div>" +
    '<div class="keybox"><div class="keybox-label">▶ ' + esc(q.expl.nm) + '</div><div class="keysegs"><div class="keyseg">' + esc(q.expl.ds) + "</div></div></div>" +
    keyHtmlFor(q.expl);
  $("qNext").hidden = false;
  $("qNext").textContent = qi + 1 >= quiz.length ? "結果を見る →" : "次の問題 →";
  $("qNext").focus({ preventScroll: true });
}

$("qNext").addEventListener("click", () => {
  qi++;
  if (qi >= quiz.length) showResult(); else renderQ();
});

function showResult(){
  $("qBar").style.width = "100%";
  $("quizPlay").hidden = true;
  const pct = Math.round(qScore / quiz.length * 100);
  const msg = pct === 100 ? "全問正解。この範囲は仕上がっています。"
            : pct >= 80 ? "あと一歩。取りこぼした項目を見直しましょう。"
            : pct >= 50 ? "紛らわしいサービスの区別を「見分け方」で固めましょう。"
            : "まずはカードモードでひと通り読み込むのがおすすめです。";
  const missed = qMissed.length
    ? '<div class="missed"><h4>取りこぼした項目 ' + qMissed.length + '</h4><ul>' +
      qMissed.map(it => "<li><b>" + esc(it.nm) + "</b>" + esc(it.ds) + "</li>").join("") + "</ul></div>"
    : "";
  $("quizResult").hidden = false;
  $("quizResult").innerHTML =
    '<div class="score" style="color:' + (pct >= 80 ? "var(--good)" : pct >= 50 ? "var(--ink)" : "var(--bad)") + '">' +
    qScore + '<small> / ' + quiz.length + "</small></div>" +
    "<h3>" + pct + "% 正解</h3><p>" + msg + "</p>" +
    '<button class="btn btn-primary" id="qAgain">' + (quizWeak ? "弱点をもう10問" : "もう10問") + "</button>" + missed;
  $("qAgain").addEventListener("click", () => startQuiz(quizWeak));
}

/* ============================================================
   一覧
   ============================================================ */
function renderList(){
  const q = $("searchInput").value.trim().toLowerCase();
  const secs = DATA.filter(s => scope === 0 || s.n === scope);
  let shown = 0;
  const html = secs.map(sec => {
    const items = sec.items.map((it, i) => ({ ...it, id: "s" + sec.n + "-" + i }))
      .filter(it => !q || (it.nm + it.ds + sec.t).toLowerCase().includes(q));
    const keys = (sec.keys || []).filter(k => !q || (k.v + k.l).toLowerCase().includes(q));
    if (!items.length && !keys.length) return "";
    shown += items.length;

    let body = "", lastG = null, buf = [];
    const flushRows = () => { if (buf.length) { body += '<div class="rows">' + buf.join("") + "</div>"; buf = []; } };
    items.forEach(it => {
      const g = it.g || "";
      if (g !== lastG) { flushRows(); if (g) body += '<div class="grp">' + esc(g) + "</div>"; lastG = g; }
      const flag = state.known[it.id] ? '<span class="flag known" title="覚えた"></span>'
                 : (state.again[it.id] || state.miss[it.id]) ? '<span class="flag again" title="要復習"></span>' : "";
      buf.push('<div class="row' + (q && (it.nm + it.ds).toLowerCase().includes(q) ? " hit" : "") + '">' +
        '<div class="nm">' + esc(it.nm) + flag + "</div><div class=\"ds\">" + esc(it.ds) + "</div></div>");
    });
    flushRows();

    return '<section class="sec"><div class="sec-head"><span class="sec-num">' + String(sec.n).padStart(2, "0") +
      '</span><h2 class="sec-title">' + esc(sec.t) + "</h2></div>" + body +
      keys.map(k => keyBox(k, sec.n, null)).join("") + "</section>";
  }).join("");

  $("listBody").innerHTML = html || '<div class="empty"><div class="big">・・・</div><p>該当する項目がありません。</p></div>';
  $("searchCount").textContent = q ? shown + "件" : "";
}
$("searchInput").addEventListener("input", renderList);

/* ============================================================
   弱点
   ============================================================ */
function renderWeak(){
  const list = weakItems();
  if (!list.length) {
    $("weakBody").innerHTML = '<div class="panel empty"><div class="big">◎</div><p>弱点カードはまだありません。<br>カードで「もう一度」を付けた項目と、4択で間違えた項目がここに集まります。</p></div>';
    return;
  }
  $("weakBody").innerHTML =
    '<div class="weak-actions"><button class="btn btn-primary" id="weakQuiz">弱点だけで4択（10問）</button>' +
    '<button class="btn" id="weakCards">弱点だけカードで回す</button></div>' +
    list.map(it => {
      const m = state.miss[it.id] || 0;
      return '<div class="weak-item"><div class="hd"><div class="nm">' + esc(it.nm) + "</div>" +
        (m ? '<span class="miss-n">4択ミス ' + m + "</span>" : "") + "</div>" +
        '<div class="ds">' + esc(it.ds) + "</div>" +
        '<div class="ft"><span class="src">' + String(it.sec).padStart(2, "0") + " / " + esc(it.secTitle) + "</span>" +
        '<button class="clearbtn" data-id="' + it.id + '">覚えた</button></div></div>';
    }).join("");

  $("weakQuiz").addEventListener("click", () => { setMode("quiz"); startQuiz(true); });
  $("weakCards").addEventListener("click", () => {
    deck = shuffle(weakItems()); deckPos = 0; flipped = false;
    setMode("card"); renderCard();
  });
  $("weakBody").querySelectorAll(".clearbtn").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.id;
    state.known[id] = 1; delete state.again[id]; delete state.miss[id];
    save(); renderMeter(); renderWeak();
  }));
}

/* ============================================================
   モード切替 / 全体
   ============================================================ */
function setMode(m){
  mode = m;
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.mode === m)));
  ["card", "quiz", "list", "weak"].forEach(k => { $("view-" + k).hidden = k !== m; });
  document.querySelector(".scopebar").hidden = (m === "weak");
  if (m === "card" && !deck.length) buildDeck();
  if (m === "card") renderCard();
  if (m === "quiz") startQuiz(false);
  if (m === "list") renderList();
  if (m === "weak") renderWeak();
  renderMeter();
}
document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));

$("btnReset").addEventListener("click", () => {
  if (!confirm("覚えた・もう一度・4択のミス記録をすべて消します。よろしいですか？")) return;
  state = { known: {}, again: {}, miss: {} }; save();
  renderMeter(); renderChips();
  if (mode === "list") renderList();
  if (mode === "weak") renderWeak();
  if (mode === "card") renderCard();
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (mode === "card") {
    if (e.key === " ") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "1") mark("again");
    else if (e.key === "2") mark("known");
  } else if (mode === "quiz") {
    if (["1", "2", "3", "4"].includes(e.key)) {
      const b = $("choices").querySelectorAll(".choice")[+e.key - 1];
      if (b && !b.disabled) b.click();
    } else if (e.key === "Enter" && !$("qNext").hidden) $("qNext").click();
  }
});

renderChips();
buildDeck();
setMode("card");
</script>
</body>
</html>
